<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#F2F3F5;background:#111318}
a{color:#F2F3F5;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#3A404C;position:relative;margin:0;cursor:pointer;flex-shrink:0}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#F2F3F5;transition:left .15s}
input[type=checkbox].sw:checked{background:#F5B544}
input[type=checkbox].sw:checked::after{left:21px;background:#111318}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111318; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 18px; font-family: Inter, system-ui, sans-serif; color: #F2F3F5">

  <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px">Настройки</div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 13px; color: #9AA0AB; font-weight: 500">Часовые пояса</div><div style="font-size: 12px; color: #6E7A8F">перетащите, чтобы изменить порядок</div></div>
    <div style="background: #1A1D24; border-radius: 14px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7A8F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Гранада <span style="color: #9AA0AB; font-size: 12px">· дом</span></div><div style="font-size: 12px; color: #9AA0AB">UTC+2</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7A8F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Москва</div><div style="font-size: 12px; color: #9AA0AB">UTC+3</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7A8F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Новосибирск</div><div style="font-size: 12px; color: #9AA0AB">UTC+7</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7A8F" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Лондон</div><div style="font-size: 12px; color: #9AA0AB">UTC+1</div></div>

    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #9AA0AB; font-weight: 500">Аккаунты</div>
    <div style="background: #1A1D24; border-radius: 14px; display: flex; flex-direction: column">

      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; color: #F5B544; font-size: 15px; font-weight: 500; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5B544" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить аккаунт</button>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #9AA0AB; font-weight: 500">Уведомления</div>
    <div style="background: #1A1D24; border-radius: 14px; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Почта</div><div style="font-size: 12px; color: #9AA0AB">только ярлык «Важные»</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Slack</div><div style="font-size: 12px; color: #9AA0AB">упоминания и личные сообщения</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Мигание при новых</div><div style="font-size: 12px; color: #9AA0AB">счётчики и точки мигают, пока не прочитано</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Напоминать о событиях</div><div style="font-size: 12px; color: #9AA0AB">за 10 минут</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #262A33; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Тихие часы</div><div style="font-size: 12px; color: #9AA0AB">23:00 – 08:00</div></div><input type="checkbox" class="sw" checked></label>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><div style="flex: 1; font-size: 15px">Проверять каждые</div><div style="display: flex; gap: 4px"><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #F5B544; color: #111318; font-size: 13px; font-weight: 600">5 мин</button><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #262A33; color: #9AA0AB; font-size: 13px; font-weight: 500">15</button><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #262A33; color: #9AA0AB; font-size: 13px; font-weight: 500">30</button></div></div>
    </div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #262A33; margin-left: -20px; margin-right: -20px; padding: 8px 0 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA0AB; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA0AB" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Сегодня</a>
    <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #9AA0AB; font-size: 11px; font-weight: 500"><span style="position: relative; display: block; width: 22px; height: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA0AB" stroke-width="1.8" aria-hidden="true"><path d="M3 13h5l2 3h4l2-3h5"></path><path d="M5 5h14l2 8v6H3v-6z"></path></svg><span class="blink" style="position: absolute; top: -2px; right: -4px; width: 10px; height: 10px; border-radius: 5px; background: #F5B544; border: 2px solid #111318; display: block"></span></span>Входящие</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #F5B544; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5B544" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#111318"></circle><circle cx="15" cy="12" r="2" fill="#111318"></circle><circle cx="8" cy="17" r="2" fill="#111318"></circle></svg>Настройки</a>
