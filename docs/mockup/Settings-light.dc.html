<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки, светлая</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#16181D;background:#F6F7F9}
a{color:#16181D;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#C9CDD5;position:relative;margin:0;cursor:pointer;flex-shrink:0}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#16181D;transition:left .15s}
input[type=checkbox].sw:checked{background:#F5B544}
input[type=checkbox].sw:checked::after{left:21px;background:#F6F7F9}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 18px; font-family: Inter, system-ui, sans-serif; color: #16181D">

  <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px">Настройки</div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 13px; color: #5F6775; font-weight: 500">Часовые пояса</div><div style="font-size: 12px; color: #6B7382">перетащите, чтобы изменить порядок</div></div>
    <div style="background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 14px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBC" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Гранада <span style="color: #5F6775; font-size: 12px">· дом</span></div><div style="font-size: 12px; color: #5F6775">UTC+2</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBC" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Москва</div><div style="font-size: 12px; color: #5F6775">UTC+3</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBC" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Новосибирск</div><div style="font-size: 12px; color: #5F6775">UTC+7</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4ADBC" stroke-width="2" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg><div style="flex: 1; font-size: 15px">Лондон</div><div style="font-size: 12px; color: #5F6775">UTC+1</div></div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; color: #B7791F; font-size: 15px; font-weight: 500; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить город</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #5F6775; font-weight: 500">Аккаунты</div>
    <div style="background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 14px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Google</div><div style="font-size: 12px; color: #5F6775">Календарь, Задачи, Gmail</div></div><div style="font-size: 12px; color: #2E8B57; font-weight: 500">подключён</div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Slack</div><div style="font-size: 12px; color: #5F6775">1 рабочее пространство</div></div><div style="font-size: 12px; color: #2E8B57; font-weight: 500">подключён</div></div>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; color: #B7791F; font-size: 15px; font-weight: 500; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить аккаунт</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #5F6775; font-weight: 500">Уведомления</div>
    <div style="background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 14px; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Почта</div><div style="font-size: 12px; color: #5F6775">только ярлык «Важные»</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Slack</div><div style="font-size: 12px; color: #5F6775">упоминания и личные сообщения</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Мигание при новых</div><div style="font-size: 12px; color: #5F6775">счётчики и точки мигают, пока не прочитано</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Напоминать о событиях</div><div style="font-size: 12px; color: #5F6775">за 10 минут</div></div><input type="checkbox" class="sw" checked></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E6E8EC; cursor: pointer"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px">Тихие часы</div><div style="font-size: 12px; color: #5F6775">23:00 – 08:00</div></div><input type="checkbox" class="sw" checked></label>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><div style="flex: 1; font-size: 15px">Проверять каждые</div><div style="display: flex; gap: 4px"><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #F5B544; color: #1B1500; font-size: 13px; font-weight: 600">5 мин</button><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #E6E8EC; color: #5F6775; font-size: 13px; font-weight: 500">15</button><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #E6E8EC; color: #5F6775; font-size: 13px; font-weight: 500">30</button></div></div>
    </div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E6E8EC; margin-left: -20px; margin-right: -20px; padding: 8px 0 14px">
    <a href="Main-light.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #5F6775; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6775" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Сегодня</a>
    <a href="Inbox-light.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #5F6775; font-size: 11px; font-weight: 500"><span style="position: relative; display: block; width: 22px; height: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6775" stroke-width="1.8" aria-hidden="true"><path d="M3 13h5l2 3h4l2-3h5"></path><path d="M5 5h14l2 8v6H3v-6z"></path></svg><span class="blink" style="position: absolute; top: -2px; right: -4px; width: 10px; height: 10px; border-radius: 5px; background: #F5B544; border: 2px solid #F6F7F9; display: block"></span></span>Входящие</a>
    <a href="Settings-light.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: #B7791F; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#F6F7F9"></circle><circle cx="15" cy="12" r="2" fill="#F6F7F9"></circle><circle cx="8" cy="17" r="2" fill="#F6F7F9"></circle></svg>Настройки</a>
  </div>
</div>
