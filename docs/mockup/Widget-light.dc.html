  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 12px">
    <div style="font-size: 14px; font-weight: 600; color: #B7791F">15:00</div>
    <div style="flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Стендап команды</div>
    <div style="font-size: 12px; color: #B7791F; font-weight: 500">через 28 мин</div>
  </div>

  <div style="display: flex; gap: 8px">
    <a href="Inbox-light.dc.html" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
      <span style="font-size: 13px; color: #5F6775">Почта</span>
      <span class="blink" style="margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #F5B544; color: #1B1500; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
    <a href="Inbox-light.dc.html" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"></path></svg>
